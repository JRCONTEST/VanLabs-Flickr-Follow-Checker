function render(){const q=search.value.trim().toLocaleLowerCase();let opened=contacts.filter(c=>visited[c.url]).length;document.getElementById('total').textContent=contacts.length;document.getElementById('opened').textContent=opened;document.getElementById('remaining').textContent=contacts.length-opened;list.replaceChildren();let shown=contacts.filter(c=>c.name.toLocaleLowerCase().includes(q)&&(filter==='all'||(filter==='opened'?!!visited[c.url]:!visited[c.url])));if(!shown.length){let e=document.createElement('div');e.className='empty';e.textContent='Nessun contatto trovato';list.append(e);return}let frag=document.createDocumentFragment();shown.forEach(c=>{let card=document.createElement('article');card.className='item'+(visited[c.url]?' visited':'');let info=document.createElement('div');let name=document.createElement('div');name.className='name';name.textContent=c.name;let meta=document.createElement('div');meta.className='meta';meta.textContent=visited[c.url]?'✓ Profilo già aperto':'Profilo non ancora aperto';info.append(name,meta);let actions=document.createElement('div');actions.className='actions';let open=document.createElement('button');open.className='action '+(visited[c.url]?'done':'open');open.textContent=visited[c.url]?'✓ APERTO':'↗ APRI PROFILO';open.addEventListener('click',()=>{window.open(c.url,'_blank','noopener,noreferrer');visited[c.url]=true;save();render()});actions.append(open);card.append(info,actions);frag.append(card)});list.append(frag)}
search.addEventListener('input',render);document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));document.getElementById('reset').addEventListener('click',()=>{if(confirm('Vuoi azzerare tutti i profili aperti?')){visited={};save();render()}});render();
</script></body></html>
